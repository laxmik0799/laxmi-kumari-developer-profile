# Generates the GitHub stats cards shown in README.md and commits them to
# profile-summary-card-output/. Runs daily, on demand, and when README changes,
# so the cards never depend on a third-party server being up.
name: Profile summary cards

on:
  schedule:
    - cron: "17 2 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md", ".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
